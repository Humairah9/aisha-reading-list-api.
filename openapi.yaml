openapi: 3.0.3
info:
  title: Reading List API
  version: 1.0.0
  description: >
    A small REST API for a reading list. Data is stored in memory only and is
    lost when the server stops. No user accounts and no personal data.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Check that the server is running
      operationId: getHealth
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
  /books:
    get:
      summary: List books (filterable, paginated)
      operationId: listBooks
      parameters:
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/Status"}
        - name: limit
          in: query
          description: Page size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          description: Number of books to skip
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: A page of books, ordered by id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookList"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
    post:
      summary: Add a book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookInput"}
            example: {title: Pride and Prejudice, author: Jane Austen, pages: 432}
      responses:
        "201":
          description: Book created
          headers:
            Location:
              description: URL of the new book
              schema: {type: string, example: /books/1}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      summary: Get one book
      operationId: getBook
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
        "400": {$ref: "#/components/responses/InvalidId"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Replace a book (omitted optional fields are reset)
      operationId: replaceBook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookInput"}
      responses:
        "200":
          description: The replaced book
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationError"}
    patch:
      summary: Update some fields of a book
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookPatch"}
            example: {status: finished, rating: 5}
      responses:
        "200":
          description: The updated book
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/ValidationError"}
    delete:
      summary: Delete a book
      operationId: deleteBook
      responses:
        "204":
          description: Deleted (no body)
        "400": {$ref: "#/components/responses/InvalidId"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  schemas:
    Status:
      type: string
      enum: [to_read, reading, finished]
    Book:
      type: object
      required: [id, title, author, status, rating, pages]
      properties:
        id: {type: integer, example: 1}
        title: {type: string, example: Pride and Prejudice}
        author: {type: string, example: Jane Austen}
        status: {$ref: "#/components/schemas/Status"}
        rating: {type: integer, nullable: true, minimum: 1, maximum: 5}
        pages: {type: integer, nullable: true, minimum: 1, maximum: 10000}
    BookInput:
      type: object
      required: [title, author]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        author: {type: string, minLength: 1, maxLength: 100}
        status: {$ref: "#/components/schemas/Status"}
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: Only allowed when status is finished.
        pages: {type: integer, nullable: true, minimum: 1, maximum: 10000}
    BookPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        author: {type: string, minLength: 1, maxLength: 100}
        status: {$ref: "#/components/schemas/Status"}
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: Only allowed when status is finished.
        pages: {type: integer, nullable: true, minimum: 1, maximum: 10000}
    BookList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Book"}
        meta:
          type: object
          properties:
            total: {type: integer}
            limit: {type: integer}
            offset: {type: integer}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string, example: validation_error}
            message: {type: string}
            details:
              type: array
              items:
                type: object
                properties:
                  field: {type: string, example: title}
                  issue: {type: string, example: must not be empty}
  responses:
    BadRequest:
      description: Body missing or not valid JSON
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidId:
      description: Id is not a positive integer
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidQuery:
      description: A query parameter is invalid
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such book
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: A book with the same title and author already exists
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    PayloadTooLarge:
      description: Body is larger than 64 KB
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    UnsupportedMediaType:
      description: Content-Type is not application/json
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ValidationError:
      description: Body is valid JSON but a field fails validation
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
